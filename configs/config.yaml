# ==============================================================================
# AI-Based Epileptic Seizure Prediction Using CHB-MIT EEG
# Configuration File
# ==============================================================================

dataset:
  root_dir: "dataset/chbmit"
  # Standard 18-channel longitudinal bipolar montage (International 10-20)
  standard_channels:
    - "FP1-F7"
    - "F7-T7"
    - "T7-P7"
    - "P7-O1"
    - "FP1-F3"
    - "F3-C3"
    - "C3-P3"
    - "P3-O1"
    - "FP2-F4"
    - "F4-C4"
    - "C4-P4"
    - "P4-O2"
    - "FP2-F8"
    - "F8-T8"
    - "T8-P8"
    - "P8-O2"
    - "FZ-CZ"
    - "CZ-PZ"
  expected_sfreq: 256.0

preprocessing:
  bandpass_low: 0.5
  bandpass_high: 40.0
  notch_freq: 50.0
  notch_q: 30.0
  normalization: "robust" # median and MAD (robust z-score)
  clip_value: 20.0

windowing:
  window_sec: 30.0
  stride_sec: 30.0
  # Preictal interval definition: [onset - pre_start_min, onset - pre_end_min]
  pre_start_min: 35.0
  pre_end_min: 5.0 # 5-minute prediction horizon / intervention buffer
  post_min: 30.0   # Postictal exclusion period
  require_full_preictal: false # Allow partial preictal if >= min_preictal_windows
  min_preictal_windows: 5

splitting:
  # Patient-independent split: completely disjoint patient groups
  train_patients:
    - "chb01"
    - "chb03"
    - "chb05"
    - "chb06"
    - "chb07"
    - "chb08"
    - "chb09"
    - "chb10"
  val_patients:
    - "chb02"
    - "chb11"
  test_patients:
    - "chb04"
    - "chb12"
  seed: 42

models:
  random_forest:
    n_estimators: 100
    max_depth: 15
    class_weight: "balanced"
    random_state: 42

  cnn_1d:
    in_channels: 18
    epochs: 10
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    dropout: 0.3

  cnn_lstm:
    in_channels: 18
    seq_len: 10
    epochs: 10
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0001
    cnn_feature_dim: 64
    lstm_hidden_dim: 64
    dropout: 0.3

evaluation:
  alarm_threshold: 0.5
  alarm_persistence: 2 # consecutive positive windows required to trigger alarm
  refractory_period_min: 60.0 # quiet period after an alarm
